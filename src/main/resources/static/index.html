<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EduSkill AI — Кіру</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="brand"><span class="dot"></span><span>EduSkill AI</span></div>

        <div class="tabs">
            <div class="tab active" data-tab="login">Кіру</div>
            <div class="tab" data-tab="register">Тіркелу</div>
        </div>

        <div id="alert" class="alert" style="display:none"></div>

        <form id="loginForm" class="form-view active">
            <div class="field">
                <label class="label" for="loginEmail">Email</label>
                <input class="input" type="email" id="loginEmail" required>
            </div>
            <div class="field">
                <label class="label" for="loginPassword">Құпиясөз</label>
                <input class="input" type="password" id="loginPassword" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Кіру</button>
        </form>

        <form id="registerForm" class="form-view">
            <div class="row">
                <div class="field">
                    <label class="label" for="regFirstName">Аты</label>
                    <input class="input" id="regFirstName" required>
                </div>
                <div class="field">
                    <label class="label" for="regLastName">Тегі</label>
                    <input class="input" id="regLastName" required>
                </div>
            </div>
            <div class="field">
                <label class="label" for="regEmail">Email</label>
                <input class="input" type="email" id="regEmail" required>
            </div>
            <div class="field">
                <label class="label" for="regPassword">Құпиясөз</label>
                <input class="input" type="password" id="regPassword" required minlength="6">
            </div>
            <div class="field">
                <label class="label" for="regRole">Рөл</label>
                <select class="input" id="regRole">
                    <option value="STUDENT">Студент</option>
                    <option value="MENTOR">Ментор</option>
                    <option value="COMPANY">Компания</option>
                </select>
            </div>
            <button class="btn btn-primary btn-block" type="submit" id="registerBtn">Тіркелу</button>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    if (isLoggedIn()) window.location.href = "dashboard.html";

    const alertEl = document.getElementById("alert");
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".form-view").forEach(f => f.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab + "Form").classList.add("active");
        hideAlert(alertEl);
      });
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        const data = await apiFetch("/api/v1/auth/authenticate", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("loginEmail").value,
            password: document.getElementById("loginPassword").value
          })
        });
        saveToken(data.token);
        window.location.href = "dashboard.html";
      } catch (err) {
        showError(alertEl, err.message || "Email немесе құпиясөз қате");
        btn.disabled = false; btn.textContent = "Кіру";
      }
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("registerBtn");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        await apiFetch("/api/v1/auth/register", {
          method: "POST",
          body: JSON.stringify({
            firstName: document.getElementById("regFirstName").value,
            lastName: document.getElementById("regLastName").value,
            email: document.getElementById("regEmail").value,
            password: document.getElementById("regPassword").value,
            role: document.getElementById("regRole").value
          })
        });
        showSuccess(alertEl, "Тіркелу сәтті өтті. Енді кіре аласыз.");
        document.querySelector('.tab[data-tab="login"]').click();
      } catch (err) {
        showError(alertEl, err.message || "Тіркелу кезінде қате шықты");
      } finally {
        btn.disabled = false; btn.textContent = "Тіркелу";
      }
    });
</script>
</body>
</html>
